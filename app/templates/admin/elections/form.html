{% extends 'admin/base_admin.html' %}{% block title %}Periode Pemira · KPRM{% endblock %}{% block content %}<div class="page-heading"><h1>{{ 'Edit' if election|default(false) else 'Tambah' }} Periode</h1></div><div class="panel-card form-card"><form method="POST" action="{{ url_for('elections.edit',id=election.id) if election|default(false) else url_for('elections.create') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="row g-3"><div class="col-md-8"><label class="form-label">Nama *</label><input class="form-control" name="name" required value="{{ election.name|default('') }}"></div><div class="col-md-4"><label class="form-label">Tahun *</label><input class="form-control" name="year" type="number" value="{{ election.year|default(2026) }}"></div><div class="col-md-6"><label class="form-label">Deskripsi</label><textarea class="form-control" name="description">{{ election.description|default('') }}</textarea></div><div class="col-md-6"><label class="form-label">Status</label><select class="form-select" name="status">{% for s in ['draft','active','completed','archived'] %}<option>{{ s }}</option>{% endfor %}</select></div><div class="col-md-6"><label class="form-label">Mulai</label><input class="form-control" type="date" name="start_date"></div><div class="col-md-6"><label class="form-label">Selesai</label><input class="form-control" type="date" name="end_date"></div></div><div class="form-actions"><a class="btn btn-light" href="{{ url_for('elections.index') }}">Batal</a><button class="btn btn-primary">Simpan</button></div></form></div>{% endblock %}
