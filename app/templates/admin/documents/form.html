{% extends 'admin/base_admin.html' %}{% block title %}Dokumen · KPRM{% endblock %}{% block content %}<div class="page-heading"><h1>{{ 'Edit' if document|default(false) else 'Tambah' }} Dokumen</h1></div><div class="panel-card form-card"><form method="POST" enctype="multipart/form-data" action="{{ url_for('content.doc_create') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label class="form-label">Judul</label><input class="form-control mb-3" name="title" required value="{{ document.title|default('') }}"><label class="form-label">Deskripsi</label><textarea class="form-control mb-3" name="description" rows="5">{{ document.description|default('') }}</textarea><label class="form-label">File</label><input class="form-control mb-3" type="file" name="file" required><label class="form-label">Kategori</label><input class="form-control" name="category" value="{{ document.category|default('Regulasi') }}"><div class="form-actions"><a class="btn btn-light" href="{{ url_for('content.doc_index') }}">Batal</a><button class="btn btn-primary">Simpan</button></div></form></div>{% endblock %}
