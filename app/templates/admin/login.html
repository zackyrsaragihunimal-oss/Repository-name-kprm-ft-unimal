<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login Admin · KPRM</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet"><link href="{{ url_for('static',filename='css/style.css') }}" rel="stylesheet"></head><body class="login-page"><div class="card login-card border-0 shadow-lg"><div class="card-body p-5 text-center"><i class="fa-solid fa-landmark brand-icon"></i><h1 class="h4 mt-3">KPRM FT UNIMAL</h1><p class="text-muted">Panel administrasi Pemira</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for cat,msg in messages %}<div class="alert alert-{{ cat }}">{{ msg }}</div>{% endfor %}{% endwith %}<form method="POST" action="{{ url_for('auth.login') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="input-group mb-3"><span class="input-group-text"><i class="fa-solid fa-user"></i></span><input class="form-control" name="username" placeholder="Username" required></div><div class="input-group mb-4"><span class="input-group-text"><i class="fa-solid fa-lock"></i></span><input class="form-control" type="password" name="password" placeholder="Password" required></div><button class="btn btn-primary w-100">Masuk</button></form><a class="d-block mt-4" href="{{ url_for('public.home') }}">Kembali ke portal</a></div></div></body></html>
