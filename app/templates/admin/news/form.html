{% extends 'admin/base_admin.html' %}{% block title %}Berita · KPRM{% endblock %}{% block content %}<div class="page-heading"><h1>{{ 'Edit' if news|default(false) else 'Tulis' }} Berita</h1></div><div class="panel-card form-card"><form method="POST" enctype="multipart/form-data" action="{{ url_for('content.news_edit',id=news.id) if news|default(false) else url_for('content.news_create') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label class="form-label">Judul</label><input class="form-control mb-3" name="title" required value="{{ news.title|default('') }}"><label class="form-label">Kategori</label><input class="form-control mb-3" name="category" value="{{ news.category|default('Kegiatan') }}"><label class="form-label">Thumbnail</label><input class="form-control mb-3" type="file" name="thumbnail"><label class="form-label">Status</label><select class="form-select mb-3" name="status"><option>draft</option><option>published</option></select><label class="form-label">Konten</label><textarea class="form-control" name="content" rows="14" required>{{ news.content|default('') }}</textarea><div class="form-actions"><a class="btn btn-light" href="{{ url_for('content.news_index') }}">Batal</a><button class="btn btn-primary">Simpan</button></div></form></div>{% endblock %}
