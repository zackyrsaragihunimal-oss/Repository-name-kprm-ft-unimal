{% extends 'admin/base_admin.html' %}{% block title %}Pengumuman · KPRM{% endblock %}{% block content %}<div class="page-heading"><h1>{{ 'Edit' if announcement|default(false) else 'Tambah' }} Pengumuman</h1></div><div class="panel-card form-card"><form method="POST" action="{{ url_for('content.ann_create',id=announcement.id) if announcement|default(false) else url_for('content.ann_create') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label class="form-label">Judul</label><input class="form-control mb-3" name="title" required value="{{ announcement.title|default('') }}"><label class="form-label">Konten</label><textarea class="form-control mb-3" name="content" rows="8" required>{{ announcement.content|default('') }}</textarea><div class="row g-3"><div class="col-md-4"><label class="form-label">Prioritas</label><select class="form-select" name="priority"><option>normal</option><option>important</option><option>urgent</option></select></div><div class="col-md-4"><label class="form-label">Mulai</label><input class="form-control" type="date" name="start_date"></div><div class="col-md-4"><label class="form-label">Selesai</label><input class="form-control" type="date" name="end_date"></div></div><div class="form-actions"><a class="btn btn-light" href="{{ url_for('content.ann_index') }}">Batal</a><button class="btn btn-primary">Simpan</button></div></form></div>{% endblock %}
