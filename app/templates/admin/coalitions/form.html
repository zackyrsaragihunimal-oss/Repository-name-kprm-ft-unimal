{% extends 'admin/base_admin.html' %}{% block title %}{{ 'Edit' if coalition|default(false) else 'Tambah' }} Koalisi · KPRM{% endblock %}{% block content %}<div class="page-heading"><div><a href="{{ url_for('coalitions.index') }}" class="back-link"><i class="fa-solid fa-arrow-left"></i> Koalisi</a><h1>{{ 'Edit' if coalition|default(false) else 'Tambah' }} Koalisi</h1></div></div><div class="panel-card form-card"><form method="POST" enctype="multipart/form-data" action="{{ url_for('coalitions.edit',id=coalition.id) if coalition|default(false) else url_for('coalitions.create') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="row g-3"><div class="col-md-6"><label class="form-label">Periode Pemira</label><select class="form-select" name="election_period_id">{% for e in elections|default([]) %}<option value="{{ e.id }}">{{ e.name }}</option>{% endfor %}</select></div><div class="col-md-6"><label class="form-label">Nama *</label><input class="form-control" type="text" name="name" value="{{ coalition.name|default('') }}"></div><div class="col-md-4"><label class="form-label">Kode *</label><input class="form-control" type="text" name="code" value="{{ coalition.code|default('') }}"></div><div class="col-md-4"><label class="form-label">Warna</label><input class="form-control" type="color" name="color" value="{{ coalition.color|default('') }}"></div><div class="col-md-4"><label class="form-label">Logo</label><input class="form-control" type="file" name="logo"></div><div class="col-md-12"><label class="form-label">Deskripsi</label><textarea class="form-control" name="description">{{ coalition.description|default('') }}</textarea></div><div class="col-md-12"><label class="form-label">Organisasi</label>{% for o in orgs|default([]) %}<label class="form-check form-check-inline"><input type="checkbox" class="form-check-input" name="org_ids[]" value="{{ o.id }}">{{ o.name }}</label>{% endfor %}</div></div><div class="form-actions"><a class="btn btn-light" href="{{ url_for('coalitions.index') }}">Batal</a><button class="btn btn-primary" type="submit">Simpan Koalisi</button></div></form></div>{% endblock %}
