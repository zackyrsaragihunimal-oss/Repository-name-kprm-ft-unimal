{% extends 'admin/base_admin.html' %}{% block title %}Galeri · KPRM{% endblock %}{% block content %}<div class="page-heading"><h1>{{ 'Edit' if item|default(false) else 'Tambah' }} Foto</h1></div><div class="panel-card form-card"><form method="POST" enctype="multipart/form-data" action="{{ url_for('content.gallery_create') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label class="form-label">Judul</label><input class="form-control mb-3" name="title" required value="{{ item.title|default('') }}"><label class="form-label">Deskripsi</label><textarea class="form-control mb-3" name="description">{{ item.description|default('') }}</textarea><label class="form-label">Gambar</label><input class="form-control mb-3" type="file" name="item" required><label class="form-label">Kategori</label><input class="form-control" name="category" value="{{ item.category|default('Kegiatan') }}"><div class="form-actions"><button class="btn btn-primary">Simpan</button></div></form></div>{% endblock %}
