{% extends 'admin/base_admin.html' %}{% block title %}Galeri · KPRM{% endblock %}{% block content %}<div class="page-heading"><h1>Galeri</h1><a href="{{ url_for('content.gallery_create') }}" class="btn btn-primary">Tambah Foto</a></div><div class="row g-4">{% for image in items|default([]) %}<div class="col-sm-6 col-lg-3"><div class="panel-card p-0 overflow-hidden"><img class="w-100" style="height:180px;object-fit:cover" src="{{ url_for('public.uploaded_file',filename=item.image_path) if item.image_path else url_for('static',filename='img/placeholder.svg') }}" alt="{{ item.title }}"><div class="p-3"><strong>{{ item.title }}</strong><form class="mt-2" method="POST" action="{{ url_for('content.gallery_delete',id=item.id) }}" onsubmit="return confirm('Hapus foto?')"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="btn btn-sm text-danger">Hapus</button></form></div></div></div>{% else %}<div class="col-12"><div class="empty-state">Belum ada foto.</div></div>{% endfor %}</div>{% endblock %}
