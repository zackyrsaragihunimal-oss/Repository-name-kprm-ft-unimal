{% extends 'admin/base_admin.html' %}{% block title %}{{ 'Edit' if student|default(false) else 'Tambah' }} Pemilih · KPRM{% endblock %}{% block content %}<div class="page-heading"><div><a href="{{ url_for('voters.index') }}" class="back-link"><i class="fa-solid fa-arrow-left"></i> Pemilih</a><h1>{{ 'Edit' if student|default(false) else 'Tambah' }} Pemilih</h1></div></div><div class="panel-card form-card"><form method="POST"  action="{{ url_for('voters.edit',id=student.id) if student|default(false) else url_for('voters.create') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="row g-3"><div class="col-md-6"><label class="form-label">NIM *</label><input class="form-control" type="text" name="nim" value="{{ student.nim|default('') }}"></div><div class="col-md-6"><label class="form-label">Nama *</label><input class="form-control" type="text" name="name" value="{{ student.name|default('') }}"></div><div class="col-md-6"><label class="form-label">Email</label><input class="form-control" type="email" name="email" value="{{ student.email|default('') }}"></div><div class="col-md-6"><label class="form-label">Telepon</label><input class="form-control" type="text" name="phone" value="{{ student.phone|default('') }}"></div><div class="col-md-6"><label class="form-label">Departemen</label><select class="form-select" name="department_id">{% for d in departments|default([]) %}<option value="{{ d.id }}">{{ d.name }}</option>{% endfor %}</select></div><div class="col-md-4"><label class="form-label">Semester</label><input class="form-control" type="number" name="semester" value="{{ student.semester|default('') }}"></div><div class="col-md-12"><label class="form-label">Eligible</label><div class="form-check form-switch"><input class="form-check-input" type="checkbox" name="is_eligible" checked><label class="form-check-label">Memenuhi syarat memilih</label></div></div></div><div class="form-actions"><a class="btn btn-light" href="{{ url_for('voters.index') }}">Batal</a><button class="btn btn-primary" type="submit">Simpan Pemilih</button></div></form></div>{% endblock %}
