{% extends 'admin/base_admin.html' %}{% block title %}Users · KPRM{% endblock %}{% block content %}<div class="page-heading"><h1>{{ 'Edit' if user|default(false) else 'Tambah' }} User</h1></div><div class="panel-card form-card"><form method="POST" action="{{ url_for('users.edit',id=user.id) if user|default(false) else url_for('users.create') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="row g-3"><div class="col-md-6"><label class="form-label">Username</label><input class="form-control" name="username" required value="{{ user.username|default('') }}"></div><div class="col-md-6"><label class="form-label">Email</label><input class="form-control" name="email" type="email" required value="{{ user.email|default('') }}"></div><div class="col-md-6"><label class="form-label">Nama Lengkap</label><input class="form-control" name="full_name" value="{{ user.full_name|default('') }}"></div><div class="col-md-6"><label class="form-label">Password</label><input class="form-control" type="password" name="password"></div><div class="col-md-6"><label class="form-label">Role</label><select class="form-select" name="role_id">{% for role in roles|default([]) %}<option value="{{ role.id }}">{{ role.name }}</option>{% endfor %}</select></div><div class="col-md-6"><label class="form-label">Aktif</label><input class="form-check-input" type="checkbox" name="is_active" checked></div></div><div class="form-actions"><button class="btn btn-primary">Simpan User</button></div></form></div>{% endblock %}
