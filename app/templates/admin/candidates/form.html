{% extends 'admin/base_admin.html' %}{% block title %}{{ 'Edit' if candidate|default(false) else 'Tambah' }} Kandidat · KPRM{% endblock %}{% block content %}<div class="page-heading"><div><a href="{{ url_for('candidates.index') }}" class="back-link"><i class="fa-solid fa-arrow-left"></i> Kandidat</a><h1>{{ 'Edit' if candidate|default(false) else 'Tambah' }} Kandidat</h1></div></div><div class="panel-card form-card"><form method="POST" enctype="multipart/form-data" action="{{ url_for('candidates.edit',id=candidate.id) if candidate|default(false) else url_for('candidates.create') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="row g-3"><div class="col-md-6"><label class="form-label">Periode Pemira</label><select class="form-select" name="election_period_id">{% for e in elections|default([]) %}<option value="{{ e.id }}">{{ e.name }}</option>{% endfor %}</select></div><div class="col-md-6"><label class="form-label">Koalisi</label><select class="form-select" name="coalition_id">{% for c in coalitions|default([]) %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}</select></div><div class="col-md-4"><label class="form-label">Nomor Urut *</label><input class="form-control" type="number" name="candidate_number" value="{{ candidate.candidate_number|default('') }}"></div><div class="col-md-8"><label class="form-label">Nama *</label><input class="form-control" type="text" name="name" value="{{ candidate.name|default('') }}"></div><div class="col-md-6"><label class="form-label">NIM</label><input class="form-control" type="text" name="nim" value="{{ candidate.nim|default('') }}"></div><div class="col-md-6"><label class="form-label">Posisi</label><input class="form-control" type="text" name="position" value="{{ candidate.position|default('') }}"></div><div class="col-md-8"><label class="form-label">Foto</label><input class="form-control" type="file" name="photo" accept="image/*"></div><div class="col-md-4"><label class="form-label">Status</label><select class="form-select" name="status"><option>draft</option><option>verified</option><option>approved</option><option>rejected</option></select></div><div class="col-md-12"><label class="form-label">Visi</label><textarea class="form-control" name="vision">{{ candidate.vision|default('') }}</textarea></div><div class="col-md-12"><label class="form-label">Misi</label><textarea class="form-control" name="mission">{{ candidate.mission|default('') }}</textarea></div><div class="col-md-12"><label class="form-label">Biografi</label><textarea class="form-control" name="biography">{{ candidate.biography|default('') }}</textarea></div><div class="col-md-12"><label class="form-label">Program Kerja</label><div id="programs"><div class="row g-2"><div class="col-4"><input class="form-control" name="program_title[]" placeholder="Judul"></div><div class="col-8"><input class="form-control" name="program_desc[]" placeholder="Deskripsi"></div></div></div><button type="button" class="btn btn-sm btn-outline-primary mt-2" onclick="programs.insertAdjacentHTML('beforeend',programs.firstElementChild.outerHTML)">Tambah program</button></div></div><div class="form-actions"><a class="btn btn-light" href="{{ url_for('candidates.index') }}">Batal</a><button class="btn btn-primary" type="submit">Simpan Kandidat</button></div></form></div>{% endblock %}
