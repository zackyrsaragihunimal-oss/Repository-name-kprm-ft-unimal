{% if pagination|default(false) %}<nav class="mt-3"><ul class="pagination justify-content-end">{% for page in pagination.iter_pages() %}{% if page %}<li class="page-item {{ 'active' if page==pagination.page else '' }}"><a class="page-link" href="{{ url_for(request.endpoint,page=page) }}">{{ page }}</a></li>{% else %}<li class="page-item disabled"><span class="page-link">…</span></li>{% endif %}{% endfor %}</ul></nav>{% endif %}
