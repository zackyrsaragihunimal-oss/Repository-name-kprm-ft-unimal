{% extends 'admin/base_admin.html' %}{% block title %}{{ 'Edit' if org|default(false) else 'Tambah' }} Himpunan · KPRM{% endblock %}{% block content %}<div class="page-heading"><div><a href="{{ url_for('organizations.index') }}" class="back-link"><i class="fa-solid fa-arrow-left"></i> Himpunan</a><h1>{{ 'Edit' if org|default(false) else 'Tambah' }} Himpunan</h1></div></div><div class="panel-card form-card"><form method="POST"  action="{{ url_for('organizations.edit',id=org.id) if org|default(false) else url_for('organizations.create') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="row g-3"><div class="col-md-6"><label class="form-label">Nama *</label><input class="form-control" type="text" name="name" value="{{ org.name|default('') }}"></div><div class="col-md-6"><label class="form-label">Kode *</label><input class="form-control" type="text" name="code" value="{{ org.code|default('') }}"></div><div class="col-md-6"><label class="form-label">Departemen</label><select class="form-select" name="department_id">{% for d in depts|default([]) %}<option value="{{ d.id }}">{{ d.name }}</option>{% endfor %}</select></div><div class="col-md-12"><label class="form-label">Deskripsi</label><textarea class="form-control" name="description">{{ org.description|default('') }}</textarea></div><div class="col-md-12"><label class="form-label">Aktif</label><input class="form-check-input" type="checkbox" name="is_active" checked> Organisasi aktif</div></div><div class="form-actions"><a class="btn btn-light" href="{{ url_for('organizations.index') }}">Batal</a><button class="btn btn-primary" type="submit">Simpan Himpunan</button></div></form></div>{% endblock %}
